name: Keep Alive

# GitHub disables scheduled workflows after 60 days without a commit to the
# default branch. Create one small monthly update to keep the summary running.
on:
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bump timestamp file
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last_run.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: keep-alive bump"
            git push
          fi
